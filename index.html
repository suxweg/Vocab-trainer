<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英単語マスター">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1218">
<link rel="manifest" href="manifest.json">
<title>中学英単語マスター</title>
<style>
:root{
  --bg:#0F1218; --sf:#171B23; --sf2:#20262F; --sf3:#2A313C;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --tx:#F2F4F8; --mu:#8A93A3; --mu2:#5C6675;
  --amber:#FFB547; --amber2:#FF8A3D; --peri:#8B9AFF; --mint:#34D399; --rose:#F87171; --sky:#5AC8FA;
  --r:20px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  --font-word:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:var(--font-ui);color:var(--tx);background:var(--bg);
  display:flex;flex-direction:column;height:100dvh;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum";
}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.hidden{display:none!important}

/* ── ヘッダー ── */
.head{display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font:800 1.1rem var(--font-word);letter-spacing:-.01em}
.brand i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--amber2));
  box-shadow:0 0 14px rgba(255,181,71,.6)}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;background:var(--sf);
  border:1px solid var(--line);font:700 .72rem var(--font-ui);color:var(--mu)}
.chip b{color:var(--tx);font-size:.85rem;font-family:var(--font-word)}
.chip.streak b{color:var(--amber)}

/* ── セグメント ── */
.seg{display:flex;margin:0 16px 8px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:3px;flex-shrink:0}
.seg button{flex:1;padding:8px 2px;border:0;background:transparent;color:var(--mu);
  font:800 .8rem var(--font-ui);border-radius:11px;transition:all .18s;white-space:nowrap}
.seg button.on{background:var(--sf3);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.seg.grade button.on{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#1A1207}
.seg button small{font-size:.65rem;opacity:.75;margin-left:2px}

/* ── カテゴリ ── */
.cats{display:flex;gap:7px;padding:0 16px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-bottom:8px}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:6px 13px;border-radius:999px;font:700 .76rem var(--font-ui);
  border:1px solid var(--line);color:var(--mu);background:var(--sf);flex-shrink:0;transition:all .15s}
.cat.on{border-color:rgba(255,181,71,.55);color:var(--amber);background:rgba(255,181,71,.1)}

/* ── プログレス ── */
.pbar{height:3px;background:var(--sf2);margin:0 16px;border-radius:3px;overflow:hidden;flex-shrink:0}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:3px;transition:width .35s ease}
.pcount{font:600 .68rem var(--font-ui);color:var(--mu2);text-align:right;padding:4px 18px 0;flex-shrink:0;font-family:var(--font-word)}

/* ── メイン ── */
.main{flex:1;display:flex;flex-direction:column;padding:4px 16px 8px;gap:8px;min-height:0;overflow:hidden}

.card{position:relative;flex-shrink:0;border-radius:var(--r);
  background:linear-gradient(180deg,#1B2029 0%,#161A21 100%);
  border:1px solid var(--line);
  box-shadow:0 24px 44px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:18px 20px;user-select:none;overflow:hidden;transition:transform .12s;cursor:pointer}
.card::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:120%;
  background:radial-gradient(60% 50% at 30% 0%,rgba(255,181,71,.10),transparent 70%);pointer-events:none}
.card.grow{flex:1}
.card:active{transform:scale(.985)}
.card.in{animation:flip .26s ease}
@keyframes flip{0%{transform:rotateY(70deg) scale(.94);opacity:0}100%{transform:none;opacity:1}}
.lbl{font:800 .64rem var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);opacity:.85;margin-bottom:8px}
.word{font:800 clamp(1.9rem,8.5vw,2.7rem)/1.08 var(--font-word);letter-spacing:-.01em;color:var(--tx);word-break:break-word;max-width:100%}
.word.ja{font-size:clamp(1.5rem,6.5vw,2.1rem)}
.pron{font:600 .92rem var(--font-ui);color:var(--sky);letter-spacing:.05em;margin-top:6px;min-height:1.3em}
.ans{margin-top:12px;padding:10px 18px;border-radius:14px;width:100%;
  background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.35);
  color:var(--mint);font:800 1.15rem var(--font-word);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.tap{position:absolute;bottom:10px;right:14px;font:600 .62rem var(--font-ui);color:var(--mu2)}
.play{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;padding:0;border:1px solid rgba(139,154,255,.4);
  background:rgba(139,154,255,.14);color:var(--peri);display:flex;align-items:center;justify-content:center;transition:all .15s}
.play:active{transform:scale(.9);background:rgba(139,154,255,.3)}
.play svg{width:15px;height:15px;margin-left:2px}
.empty{font:700 .95rem var(--font-ui);color:var(--mu);line-height:1.7}

/* ── 不正解パネル ── */
.wp{position:relative;flex:1;min-height:0;border-radius:var(--r);padding:12px 44px;gap:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;text-align:center;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#261518,#1B1114);border:1.5px solid rgba(248,113,113,.55);animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.wp .lbl{color:var(--rose);opacity:1;margin:0}
.wp .big{font:800 clamp(1.5rem,7vw,2.3rem)/1.1 var(--font-word);color:#fff;letter-spacing:.02em;word-break:break-word;max-width:100%;flex-shrink:0}
.wp .pron{color:var(--amber);margin:0}
.tiles{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:100%;flex-shrink:0}
.tile{width:28px;height:35px;border-radius:8px;background:#2E1B20;border:1px solid rgba(248,113,113,.5);
  display:flex;align-items:center;justify-content:center;font:800 1rem var(--font-word);color:var(--amber);flex-shrink:0}
.tile.sp{width:12px;background:transparent;border:0}
.wp .ja{font:800 .9rem var(--font-ui);color:#D6DEE8;flex-shrink:0}
.wp .lbl,.wp .pron,.wp .yours,.wp .wpplay{flex-shrink:0}
@media (max-height:720px){.wp .pron,.wp .ja{display:none}.wp{gap:5px;padding:10px 40px}.wp .big{font-size:1.45rem}.wp.quiz .tiles{display:none}}
.wp .yours{font:600 .78rem var(--font-ui);color:var(--mu)}
.wp .yours s{color:#ff8a94}
.wp.quiz .pron,.wp.quiz .ja,.wp.quiz .yours{display:none}
.wpplay{position:absolute;top:8px;right:8px;width:36px;height:36px;padding:0;justify-content:center;display:flex;align-items:center;gap:0;border-radius:999px;border:1px solid rgba(139,154,255,.45);
  background:rgba(139,154,255,.14);color:var(--peri);font:800 .82rem var(--font-ui)}
.wpplay svg{width:16px;height:16px}

/* ── 4択 ── */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.ch{padding:14px 10px;border-radius:16px;border:1px solid var(--line2);background:var(--sf2);color:var(--tx);
  font:700 .95rem/1.3 var(--font-ui);text-align:center;transition:all .15s;min-height:56px}
.ch:active:not(:disabled){transform:scale(.96)}
.ch:disabled{cursor:default}
.ch.ok{background:rgba(52,211,153,.16);border-color:var(--mint);color:var(--mint)}
.ch.ng{background:rgba(248,113,113,.14);border-color:var(--rose);color:var(--rose)}
.ch small{display:block;font:600 .72rem var(--font-ui);opacity:.85;margin-top:2px}

/* ── 入力 ── */
.inp{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line2);background:var(--sf2);color:var(--tx);
  font:700 1.2rem var(--font-word);letter-spacing:.05em;text-align:center;outline:none;flex-shrink:0;transition:border-color .15s}
.inp:focus{border-color:var(--peri)}
.inp.ok{border-color:var(--mint);background:rgba(52,211,153,.12);color:var(--mint)}
.inp.ng{border-color:var(--rose);background:rgba(248,113,113,.14);color:#FF8A94}

.fb{font:800 .88rem var(--font-ui);text-align:center;min-height:20px;flex-shrink:0}
.fb.ok{color:var(--mint)}.fb.ng{color:var(--rose)}

/* ── ボトム ── */
.bottom{display:flex;gap:8px;padding:6px 16px calc(12px + env(safe-area-inset-bottom));flex-shrink:0}
.btn{flex:1;padding:15px 8px;border-radius:16px;border:1px solid var(--line2);background:var(--sf);color:var(--tx);
  font:800 .95rem var(--font-ui);transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{flex:2;border:0;color:#1A1207;background:linear-gradient(135deg,var(--amber),var(--amber2));
  box-shadow:0 10px 22px -10px rgba(255,181,71,.7)}
.btn.ok{flex:1.4;background:rgba(52,211,153,.16);border-color:var(--mint);color:var(--mint)}
.btn.ng{flex:1;background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.6);color:var(--rose)}

/* ── 結果 ── */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.result .emo{font-size:3.2rem;animation:bounce .7s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.result h2{font:800 1.5rem var(--font-word);color:var(--amber)}
.result .score{font:800 3rem/1 var(--font-word)}
.result .score span{font-size:1.2rem;color:var(--mint)}
.result p{font:600 .88rem var(--font-ui);color:var(--mu)}
.result .acts{display:flex;gap:8px;margin-top:12px;width:100%;max-width:340px}
.result .acts .btn{padding:14px 10px}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:99;padding:7px 14px;border-radius:999px;
  background:linear-gradient(135deg,#FF6B6B,#FF8A3D);color:#fff;font:800 .82rem var(--font-ui);
  box-shadow:0 8px 24px -6px rgba(255,107,107,.6);animation:slide .3s ease}
@keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<div class="head">
  <div class="brand"><i></i>英単語マスター</div>
  <div class="chips">
    <div class="chip">✓<b id="stScore">0</b></div>
    <div class="chip streak">🔥<b id="stStreak">0</b></div>
    <div class="chip">📚<b id="stStudied">0</b></div>
  </div>
</div>

<div class="seg grade" id="segGrade"></div>
<div class="seg" id="segMode"></div>
<div class="cats" id="lvs"></div>
<div class="pbar"><div class="pfill" id="pfill"></div></div>
<div class="pcount" id="pcount"></div>

<div class="main">
  <div class="card" id="card" onclick="onCard()">
    <button class="play" id="play" onclick="event.stopPropagation();speak(S.cur&&S.cur.en)" aria-label="発音">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5a.5.5 0 0 1 .757-.429l9 5a.5.5 0 0 1 0 .858l-9 5A.5.5 0 0 1 3 12.5v-10z"/></svg>
    </button>
    <div class="lbl" id="lbl"></div>
    <div class="word" id="word"></div>
    <div class="pron" id="pron"></div>
    <div class="ans hidden" id="ans"></div>
    <div class="tap" id="tap">タップで答え</div>
  </div>

  <div class="wp hidden" id="wp">
    <div class="lbl">正しいスペル</div>
    <div class="big" id="wpWord"></div>
    <div class="tiles" id="tiles"></div>
    <div class="pron" id="wpPron"></div>
    <div class="ja" id="wpJa"></div>
    <div class="yours" id="wpYours"></div>
    <button class="wpplay" aria-label="発音を聞く" onclick="speak(S.cur&&S.cur.en)">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5a.5.5 0 0 1 .757-.429l9 5a.5.5 0 0 1 0 .858l-9 5A.5.5 0 0 1 3 12.5v-10z"/></svg>
    </button>
  </div>

  <div class="choices hidden" id="choices"></div>
  <input class="inp hidden" id="inp" type="text" placeholder="英語を入力" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
  <div class="fb" id="fb"></div>

  <div class="result hidden" id="result">
    <div class="emo" id="rEmo">🎉</div>
    <h2>おつかれさま！</h2>
    <div class="score" id="rScore"></div>
    <p id="rMsg"></p>
    <div class="acts">
      <button class="btn" onclick="restartQueue();startSession()">もう一度（新しい順番）</button>
      <button class="btn pri hidden" id="rWeak" onclick="setGrade('weak')">苦手を復習</button>
    </div>
  </div>
</div>

<div class="bottom" id="bottom">
  <button class="btn" id="bL"></button>
  <button class="btn pri" id="bR"></button>
</div>

<script>

const GRADES = ["中1","中2","中3"];
const MODES = [["flash","📖 フラッシュ"],["quiz","🎯 クイズ"],["type","⌨️ タイピング"]];

// ── データ整形 ──
const DB = {};
GRADES.forEach(g=>{DB[g]={};for(const c in RAW[g]){DB[g][c]=RAW[g][c].map(([en,pron,ja,lv])=>({id:g+"|"+c+"|"+en,g,c,en,pron,ja,lv:lv||2}));}});
const ALL = GRADES.flatMap(g=>Object.values(DB[g]).flat());

// ── 保存 ──
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let weak = new Set(LS.get("em.weak",[]));
const saveWeak=()=>LS.set("em.weak",[...weak]);

// ── 状態 ──
const S = {grade:LS.get("em.grade","中1"), mode:LS.get("em.mode","flash"), lv:LS.get("em.lv",1),
  words:[], q:[], i:0, score:0, streak:0, studied:0, total:0, correct:0,
  answered:false, revealed:false, cur:null, enToJa:true, sessionWrong:new Set()};
if(S.grade==="weak" && !weak.size) S.grade="中1";

// ── 音声（ボタンを押した時だけ） ──
let voiceEN=null;
function pickVoice(){ if(!window.speechSynthesis) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  voiceEN = vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha/i.test(v.name))
         || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){ if(!t||!window.speechSynthesis) return;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US"; if(voiceEN) u.voice=voiceEN; u.rate=.85; u.pitch=1; speechSynthesis.speak(u); }

// ── ヘルパー ──
const $=id=>document.getElementById(id);
const show=id=>$(id).classList.remove("hidden"), hide=id=>$(id).classList.add("hidden");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const LEVELS=[[0,"すべて"],[1,"★ 超基本"],[2,"★★ 基本"],[3,"★★★ 発展"]];
function wordsFor(g){ const a = g==="weak" ? ALL.filter(w=>weak.has(w.id)) : Object.values(DB[g]).flat();
  return S.lv ? a.filter(w=>w.lv===S.lv) : a; }
function drawLvs(){ const el=$("lvs"); el.innerHTML=""; LEVELS.forEach(([v,l])=>{const b=document.createElement("button");
  b.className="cat"+(S.lv===v?" on":""); const base = S.grade==="weak" ? ALL.filter(w=>weak.has(w.id)) : Object.values(DB[S.grade]).flat();
  b.textContent=l+" "+base.filter(w=>!v||w.lv===v).length; b.onclick=()=>setLv(v); el.appendChild(b);}); }
function setLv(v){ S.lv=v; LS.set("em.lv",v); drawLvs(); startSession(); }

// ── UI構築 ──
function drawSegs(){
  $("segGrade").innerHTML = [...GRADES.map(g=>`<button class="${S.grade===g?"on":""}" onclick="setGrade('${g}')">${g}</button>`),
    `<button class="${S.grade==="weak"?"on":""}" onclick="setGrade('weak')">苦手<small>${weak.size}</small></button>`].join("");
  $("segMode").innerHTML = MODES.map(([k,l])=>`<button class="${S.mode===k?"on":""}" onclick="setMode('${k}')">${l}</button>`).join("");
}
function setGrade(g){ S.grade=g; LS.set("em.grade",g);
  if(g==="weak"){ const has=v=>ALL.some(w=>weak.has(w.id)&&(!v||w.lv===v)); if(!has(S.lv)) S.lv=0; }
  drawSegs(); drawLvs(); startSession(); }
function setMode(m){ S.mode=m; LS.set("em.mode",m); drawSegs(); startSession(true); }   // モード切替は続きから

// ── 出題キュー：学年×レベルの全語を1周ぶんシャッフルし、途中の位置を保存（閉じても続きから）。1周終わると次は新しい順番 ──
function qKey(){ return "em.q."+S.grade+"."+S.lv; }
function loadQueue(words){
  if(S.grade==="weak") return {q:shuffle([...words]), i:0};              // 苦手は毎回作り直す
  const saved=LS.get(qKey(),null); const byId=new Map(words.map(w=>[w.id,w]));
  if(saved && Array.isArray(saved.ids) && saved.ids.length===words.length && saved.ids.every(id=>byId.has(id)) && saved.i<saved.ids.length)
    return {q:saved.ids.map(id=>byId.get(id)), i:saved.i};
  const q=shuffle([...words]); LS.set(qKey(),{ids:q.map(w=>w.id),i:0}); return {q,i:0};
}
function saveQueuePos(){ if(S.grade==="weak") return; LS.set(qKey(),{ids:S.q.map(w=>w.id),i:S.i}); }
function restartQueue(){ if(S.grade!=="weak") LS.set(qKey(),null); }

function startSession(resume){
  S.words = wordsFor(S.grade);
  if(!resume){ const {q,i}=loadQueue(S.words); S.q=q; S.i=i; S.score=S.streak=S.studied=S.total=S.correct=0; S.sessionWrong=new Set(); }
  stats(); hide("result"); show("card"); show("bottom"); render();
}
function stats(){ $("stScore").textContent=S.score; $("stStreak").textContent=S.streak; $("stStudied").textContent=S.studied; }

function setBtns(l,r){ // [text,class,fn] / null
  const L=$("bL"),R=$("bR");
  [[L,l],[R,r]].forEach(([b,d])=>{ if(!d){b.classList.add("hidden");return;} b.classList.remove("hidden");
    b.textContent=d[0]; b.className="btn "+(d[1]||""); b.onclick=d[2]; });
}

// ── 描画 ──
function render(){
  const card=$("card");
  hide("wp"); hide("choices"); hide("inp"); hide("ans"); card.classList.remove("grow");
  $("fb").textContent=""; $("fb").className="fb"; $("pron").textContent=""; $("tap").style.display="none";
  if(!S.words.length){ // 苦手なし
    $("lbl").textContent=""; $("word").textContent="🎉"; $("word").className="word";
    $("pron").innerHTML='<span class="empty">'+(S.grade==="weak"?"苦手な単語はありません<br>クイズやタイピングで間違えた単語がここに集まります":"このレベルの苦手はありません")+'</span>';
    card.classList.add("grow"); $("play").style.display="none"; hide("bottom"); $("pcount").textContent=""; return;
  }
  if(S.i>=S.q.length){ result(); return; }
  const w=S.q[S.i]; S.cur=w; S.answered=false; S.revealed=false; S.enToJa=Math.random()<.5;
  $("play").style.display="flex"; card.classList.add("grow");
  $("pfill").style.width=Math.round(S.i/S.q.length*100)+"%"; $("pcount").textContent=(S.i+1)+" / "+S.q.length;
  if(S.mode==="flash") showFlash(w); else if(S.mode==="quiz") showQuiz(w); else showType(w);
  card.classList.remove("in"); void card.offsetWidth; card.classList.add("in");
}
function setWord(t,isJa){ $("word").textContent=t; $("word").className="word"+(isJa?" ja":""); }

function showFlash(w){
  $("lbl").textContent=S.enToJa?"英語 → 日本語":"日本語 → 英語";
  setWord(S.enToJa?w.en:w.ja, !S.enToJa);
  $("ans").textContent=S.enToJa?w.ja:w.en; $("tap").style.display="block";
  setBtns(["← 戻る","",prev],["答えを見る","pri",reveal]);
}
function reveal(){
  if(S.revealed) return; S.revealed=true; S.studied++; stats();
  show("ans"); $("pron").textContent="[ "+S.cur.pron+" ]"; $("tap").style.display="none";
  setBtns(["まだ","ng",()=>grade(false)],["覚えた ✓","ok",()=>grade(true)]);
}
function grade(ok){ if(ok) weak.delete(S.cur.id); else { weak.add(S.cur.id); S.sessionWrong.add(S.cur.id); } saveWeak(); drawSegs(); next(); }
function onCard(){ if(S.mode!=="flash") return; S.revealed?next():reveal(); }

function showQuiz(w){
  $("lbl").textContent=S.enToJa?"日本語は？":"英語は？";
  setWord(S.enToJa?w.en:w.ja, !S.enToJa);
  const key=S.enToJa?"ja":"en", correct=w[key];
  let pool=DB[w.g][w.c].filter(x=>x[key]!==correct);
  if(pool.length<3) pool=Object.values(DB[w.g]).flat().filter(x=>x[key]!==correct);
  const seen=new Set([correct]); const wrongs=[];
  for(const x of shuffle([...pool])){ if(!seen.has(x[key])){seen.add(x[key]);wrongs.push(x[key]);} if(wrongs.length===3) break; }
  const el=$("choices"); el.innerHTML="";
  shuffle([correct,...wrongs]).forEach(o=>{const b=document.createElement("button");b.className="ch";b.textContent=o;
    b.onclick=()=>pick(b,o,correct);el.appendChild(b);});
  show("choices"); setBtns(["← 戻る","",prev],["スキップ →","",next]);
}
function pick(btn,sel,correct){
  if(S.answered) return; S.answered=true; S.total++; S.studied++;
  document.querySelectorAll(".ch").forEach(b=>{b.disabled=true;
    if(b.textContent===correct){b.classList.add("ok");b.innerHTML=correct+"<small>[ "+S.cur.pron+" ]</small>";}});
  if(sel===correct){ S.score++; S.streak++; S.correct++; weak.delete(S.cur.id); saveWeak(); feedback(true);
    if(S.streak>=3) toast(); stats(); setTimeout(next,1000); }
  else{ btn.classList.add("ng"); S.streak=0; weak.add(S.cur.id); S.sessionWrong.add(S.cur.id); saveWeak(); feedback(false);
    wrongPanel(S.cur, S.enToJa?null:sel); stats(); setBtns(["← 戻る","",prev],["次へ →","pri",next]); }
  drawSegs();
}

function showType(w){
  $("lbl").textContent="英語でつづりを入力"; setWord(w.ja,true);
  const inp=$("inp"); inp.value=""; inp.className="inp"; inp.disabled=false; show("inp");
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); S.answered?next():check(); } };
  setBtns(["← 戻る","",prev],["確認 ✓","pri",check]);
}
function check(){
  if(S.answered) return; const inp=$("inp"), w=S.cur, v=inp.value.trim().toLowerCase();
  if(!v) return; S.answered=true; S.total++; S.studied++; inp.disabled=true; inp.blur();
  $("pron").textContent="[ "+w.pron+" ]";
  if(v===w.en.toLowerCase()){ inp.className="inp ok"; S.score++; S.streak++; S.correct++; weak.delete(w.id); saveWeak();
    feedback(true); if(S.streak>=3) toast(); stats(); setTimeout(next,1000); }
  else{ inp.className="inp ng"; S.streak=0; weak.add(w.id); S.sessionWrong.add(w.id); saveWeak(); feedback(false);
    wrongPanel(w, inp.value.trim()); stats(); setBtns(["← 戻る","",prev],["次へ →","pri",next]); }
  drawSegs();
}

function wrongPanel(w,yours){
  $("wpWord").textContent=w.en; $("wpPron").textContent="[ "+w.pron+" ]"; $("wpJa").textContent=w.ja;
  $("wpYours").innerHTML = yours ? "あなたの答え：<s>"+esc(yours)+"</s>" : "";
  const t=$("tiles"); t.innerHTML="";
  [...w.en].forEach(ch=>{const d=document.createElement("div");d.className="tile"+(ch===" "?" sp":"");d.textContent=ch===" "?"":ch;t.appendChild(d);});
  $("wp").classList.toggle("quiz", S.mode==="quiz");
  $("card").classList.remove("grow"); show("wp");
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function feedback(ok){ const f=$("fb");
  f.textContent = ok ? ["すごい！🎉","その調子！✨","パーフェクト ⭐","よくできました 🌟","Great! 👏"][Math.random()*5|0] : "おしい… しっかり覚えよう";
  f.className="fb "+(ok?"ok":"ng"); }
function toast(){ document.querySelector(".toast")?.remove(); const t=document.createElement("div");
  t.className="toast"; t.textContent="🔥 "+S.streak+"連続正解！"; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

function next(){ S.i++; saveQueuePos(); render(); }
function prev(){ if(S.i>0){ S.i--; saveQueuePos(); render(); } }

function result(){
  hide("card"); hide("wp"); hide("choices"); hide("inp"); hide("bottom"); $("fb").textContent="";
  $("pfill").style.width="100%"; $("pcount").textContent=""; restartQueue();
  const n=S.q.length, wrong=S.sessionWrong.size;
  if(S.mode==="flash"){ $("rEmo").textContent="📖"; $("rScore").innerHTML=n+' <span>枚</span>';
    $("rMsg").textContent = wrong ? "「まだ」が "+wrong+" 語 → 苦手に登録しました" : "全部「覚えた」！すばらしい"; }
  else{ const pct=S.total?Math.round(S.correct/S.total*100):0;
    $("rEmo").textContent=pct>=90?"🏆":pct>=70?"🎉":"💪"; $("rScore").innerHTML=S.correct+' <span>/ '+S.total+'</span>';
    $("rMsg").textContent=(pct>=90?"完璧に近い！":pct>=70?"よくできました":"もう一回やろう")+"（正答率 "+pct+"%）"; }
  $("rWeak").classList.toggle("hidden", !weak.size || S.grade==="weak");
  show("result");
}

// ── 起動 ──
drawSegs(); drawLvs(); startSession();
</script>

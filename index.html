<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英単語マスター</title>
<!-- PWA: iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英単語マスター">
<!-- PWA: Android -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1923">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1923;
    --card: #1a2635;
    --card2: #243044;
    --accent: #f9c846;
    --accent3: #4ecdc4;
    --accent4: #a29bfe;
    --text: #f0f4f8;
    --muted: #667788;
    --correct: #26de81;
    --wrong: #ff4757;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 6px;
    flex-shrink: 0;
  }

  .app-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--accent);
  }

  .stats-row { display: flex; gap: 10px; font-size: 0.78rem; font-weight: 800; }
  .stat { color: var(--muted); }
  .stat b { color: var(--accent); font-size: 0.95rem; }

  /* PROGRESS */
  .progress-bar {
    height: 4px;
    background: var(--card2);
    flex-shrink: 0;
    margin: 0 14px;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent3), var(--accent4));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* MODE TABS */
  .mode-tabs {
    display: flex;
    margin: 8px 14px;
    background: var(--card);
    border-radius: 12px;
    padding: 3px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .mode-tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.8rem;
    padding: 7px 4px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-tab.active { background: var(--accent); color: #1a1a2e; }

  /* CATEGORIES */
  .cat-scroll {
    display: flex;
    gap: 7px;
    padding: 0 14px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 6px;
  }
  .cat-scroll::-webkit-scrollbar { display: none; }

  .cat-pill {
    white-space: nowrap;
    padding: 5px 13px;
    border-radius: 50px;
    font-size: 0.78rem;
    font-weight: 800;
    cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.07);
    color: var(--muted);
    background: var(--card);
    flex-shrink: 0;
    transition: all 0.18s;
  }

  .cat-pill.active {
    border-color: var(--accent3);
    color: var(--accent3);
    background: rgba(78,205,196,0.12);
  }

  /* MAIN AREA */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6px 14px;
    gap: 8px;
    overflow: hidden;
    min-height: 0;
  }

  /* FLASHCARD */
  .flashcard {
    flex: 1;
    border-radius: 18px;
    background: var(--card);
    border: 1.5px solid rgba(255,255,255,0.06);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 22px;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    user-select: none;
    overflow: hidden;
    min-height: 0;
    transition: transform 0.12s;
  }

  .flashcard:active { transform: scale(0.98); }

  .flashcard.flip-anim { animation: flipIn 0.28s ease; }

  @keyframes flipIn {
    0%   { transform: rotateY(80deg) scale(0.92); opacity: 0; }
    100% { transform: rotateY(0) scale(1); opacity: 1; }
  }

  .card-label {
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    opacity: 0.75;
  }

  .card-word {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.9rem, 8vw, 2.8rem);
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .card-hint { font-size: 0.8rem; color: var(--muted); font-style: italic; }

  .card-answer {
    margin-top: 12px;
    padding: 10px 18px;
    background: rgba(78,205,196,0.12);
    border: 1.5px solid rgba(78,205,196,0.3);
    border-radius: 10px;
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--accent3);
    width: 100%;
  }

  .tap-hint {
    position: absolute;
    bottom: 10px; right: 13px;
    font-size: 0.66rem;
    color: var(--muted);
    opacity: 0.5;
  }

  /* CHOICES */
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    flex-shrink: 0;
  }

  .choice-btn {
    padding: 13px 10px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.08);
    background: var(--card2);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.25;
  }

  .choice-btn:active:not(:disabled) { transform: scale(0.96); }
  .choice-btn.correct { border-color: var(--correct); background: rgba(38,222,129,0.15); color: var(--correct); }
  .choice-btn.wrong   { border-color: var(--wrong);   background: rgba(255,71,87,0.13);  color: var(--wrong); }
  .choice-btn:disabled { cursor: default; }

  /* TYPING */
  .typing-input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: var(--card2);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
    flex-shrink: 0;
  }

  .typing-input:focus  { border-color: var(--accent4); }
  .typing-input.correct { border-color: var(--correct); background: rgba(38,222,129,0.08); }
  .typing-input.wrong   { border-color: var(--wrong);   background: rgba(255,71,87,0.08); }

  /* FEEDBACK */
  .feedback {
    font-size: 0.88rem;
    font-weight: 900;
    text-align: center;
    min-height: 20px;
    flex-shrink: 0;
  }
  .feedback.correct { color: var(--correct); }
  .feedback.wrong   { color: var(--wrong); }

  /* BOTTOM BUTTONS */
  .bottom-btns {
    display: flex;
    gap: 8px;
    padding: 8px 14px 12px;
    flex-shrink: 0;
  }

  .nav-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .nav-btn:active { transform: scale(0.97); }

  .next-btn { flex: 2; background: linear-gradient(135deg,#667eea,#764ba2); border-color: transparent; color:#fff; }
  .submit-btn { flex: 2; background: var(--accent); border-color: transparent; color: #1a1a2e; }

  /* RESULT */
  .result-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
  }

  .result-emoji { font-size: 3.2rem; animation: bounce 0.7s ease; }

  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-14px); }
  }

  .result-title { font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: var(--accent); }
  .result-score { font-size: 2.8rem; font-weight: 900; }
  .result-score span { color: var(--accent3); font-size: 1.4rem; font-weight: 700; }
  .result-msg { color: var(--muted); font-size: 0.88rem; }

  .retry-btn {
    margin-top: 10px;
    padding: 14px 36px;
    border-radius: 50px;
    border: none;
    background: var(--accent);
    color: #1a1a2e;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .retry-btn:active { transform: scale(0.97); }

  /* STREAK */
  .streak-badge {
    position: fixed;
    top: 14px; right: 14px;
    background: #ff6b6b;
    color: #fff;
    border-radius: 50px;
    padding: 6px 14px;
    font-weight: 900;
    font-size: 0.82rem;
    z-index: 999;
    animation: slideIn 0.3s ease;
    box-shadow: 0 4px 18px rgba(255,107,107,0.45);
  }

  @keyframes slideIn {
    from { transform: translateX(80px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <div class="app-title">🌟 英単語マスター</div>
  <div class="stats-row">
    <div class="stat">✅<b id="score">0</b></div>
    <div class="stat">🔥<b id="streak">0</b></div>
    <div class="stat">📚<b id="studied">0</b></div>
  </div>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<div class="mode-tabs">
  <button class="mode-tab active" onclick="setMode('flash')">📖 フラッシュ</button>
  <button class="mode-tab" onclick="setMode('quiz')">🎯 クイズ</button>
  <button class="mode-tab" onclick="setMode('type')">⌨️ タイピング</button>
</div>

<div class="cat-scroll" id="categories"></div>

<div class="main-area" id="mainArea">
  <div class="flashcard" id="flashcard" onclick="handleCardClick()">
    <div class="card-label" id="cardLabel">英語 → 日本語</div>
    <div class="card-word" id="cardWord"></div>
    <div class="card-hint" id="cardHint"></div>
    <div class="card-answer hidden" id="cardAnswer"></div>
    <div class="tap-hint" id="tapHint">タップして答えを見る</div>
  </div>

  <div class="choices hidden" id="choices"></div>

  <input class="typing-input hidden" id="typingInput" type="text"
    placeholder="英語を入力…" autocomplete="off" autocorrect="off"
    autocapitalize="off" spellcheck="false" />

  <div class="feedback" id="feedback"></div>

  <div class="result-screen hidden" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title">おつかれさま！</div>
    <div class="result-score" id="resultScore">0 <span>/ 0問</span></div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="retry-btn" onclick="restart()">🔄 もう一度！</button>
  </div>
</div>

<div class="bottom-btns" id="bottomBtns">
  <button class="nav-btn" onclick="prevCard()">← 戻る</button>
  <button class="nav-btn next-btn" id="nextBtn" onclick="nextCard()">次へ →</button>
  <button class="nav-btn submit-btn hidden" id="submitBtn" onclick="checkTyping()">✔ 確認</button>
</div>

<script>
const wordData = {
  "動物": [
    {en:"dog",ja:"犬",hint:"ペットとして人気"},{en:"cat",ja:"猫",hint:"ニャーと鳴く"},
    {en:"bird",ja:"鳥",hint:"空を飛ぶ"},{en:"fish",ja:"魚",hint:"水の中にいる"},
    {en:"rabbit",ja:"ウサギ",hint:"耳が長い"},{en:"horse",ja:"馬",hint:"速く走る動物"},
    {en:"cow",ja:"牛",hint:"ミルクをくれる"},{en:"pig",ja:"豚",hint:"ブーブーと鳴く"},
    {en:"elephant",ja:"ゾウ",hint:"鼻が長い大きな動物"},{en:"lion",ja:"ライオン",hint:"百獣の王"},
    {en:"tiger",ja:"トラ",hint:"しまもようの動物"},{en:"monkey",ja:"サル",hint:"バナナが好き"},
    {en:"bear",ja:"クマ",hint:"冬眠する大きな動物"},{en:"fox",ja:"キツネ",hint:"ずる賢いといわれる"},
    {en:"wolf",ja:"オオカミ",hint:"群れで生活する"},
  ],
  "食べ物": [
    {en:"apple",ja:"りんご",hint:"赤くて丸い果物"},{en:"bread",ja:"パン",hint:"朝ごはんによく食べる"},
    {en:"milk",ja:"牛乳",hint:"カルシウムが豊富"},{en:"rice",ja:"ご飯・米",hint:"日本の主食"},
    {en:"egg",ja:"卵",hint:"鶏が産む"},{en:"cake",ja:"ケーキ",hint:"誕生日に食べる"},
    {en:"pizza",ja:"ピザ",hint:"イタリア料理"},{en:"soup",ja:"スープ",hint:"温かい汁物"},
    {en:"salad",ja:"サラダ",hint:"野菜を使った料理"},{en:"juice",ja:"ジュース",hint:"果物から作る飲み物"},
    {en:"water",ja:"水",hint:"透明な飲み物"},{en:"cookie",ja:"クッキー",hint:"甘い焼き菓子"},
    {en:"banana",ja:"バナナ",hint:"黄色い長い果物"},{en:"orange",ja:"オレンジ",hint:"オレンジ色の柑橘類"},
    {en:"meat",ja:"肉",hint:"動物性タンパク質"},
  ],
  "学校": [
    {en:"book",ja:"本",hint:"読んで勉強する"},{en:"pen",ja:"ペン",hint:"字を書く道具"},
    {en:"desk",ja:"机",hint:"座って勉強する場所"},{en:"chair",ja:"いす",hint:"座るための家具"},
    {en:"class",ja:"クラス・授業",hint:"学校での集まり"},{en:"teacher",ja:"先生",hint:"教えてくれる人"},
    {en:"student",ja:"生徒",hint:"学ぶ人"},{en:"school",ja:"学校",hint:"勉強する場所"},
    {en:"library",ja:"図書館",hint:"本がたくさんある場所"},{en:"music",ja:"音楽",hint:"音を楽しむ芸術"},
    {en:"art",ja:"美術",hint:"絵や作品を作る"},{en:"math",ja:"数学",hint:"計算や図形を学ぶ"},
    {en:"English",ja:"英語",hint:"今まさに学んでいる言語"},{en:"notebook",ja:"ノート",hint:"書き込める薄い本"},
    {en:"eraser",ja:"消しゴム",hint:"書いた字を消す道具"},
  ],
  "日常": [
    {en:"house",ja:"家",hint:"人が住む建物"},{en:"room",ja:"部屋",hint:"家の中の空間"},
    {en:"door",ja:"ドア",hint:"出入り口"},{en:"window",ja:"窓",hint:"光を取り込む開口部"},
    {en:"bed",ja:"ベッド",hint:"眠る場所"},{en:"car",ja:"車",hint:"道路を走る乗り物"},
    {en:"bus",ja:"バス",hint:"大勢の人を運ぶ乗り物"},{en:"train",ja:"電車",hint:"線路を走る乗り物"},
    {en:"phone",ja:"電話",hint:"話しかける道具"},{en:"time",ja:"時間",hint:"秒・分・時間で計る"},
    {en:"day",ja:"日・昼間",hint:"24時間のこと"},{en:"night",ja:"夜",hint:"暗い時間帯"},
    {en:"morning",ja:"朝",hint:"一日の始まり"},{en:"friend",ja:"友達",hint:"仲良しの人"},
    {en:"family",ja:"家族",hint:"親や兄弟のグループ"},
  ],
  "形容詞": [
    {en:"big",ja:"大きい",hint:"サイズが大きいこと"},{en:"small",ja:"小さい",hint:"サイズが小さいこと"},
    {en:"hot",ja:"熱い・暑い",hint:"温度が高い"},{en:"cold",ja:"冷たい・寒い",hint:"温度が低い"},
    {en:"fast",ja:"速い",hint:"スピードがある"},{en:"slow",ja:"遅い",hint:"スピードがない"},
    {en:"new",ja:"新しい",hint:"できたばかり"},{en:"old",ja:"古い",hint:"時間が経っている"},
    {en:"happy",ja:"うれしい",hint:"ポジティブな気持ち"},{en:"sad",ja:"悲しい",hint:"ネガティブな気持ち"},
    {en:"good",ja:"良い",hint:"優れている"},{en:"bad",ja:"悪い",hint:"よくない"},
    {en:"long",ja:"長い",hint:"長さがある"},{en:"short",ja:"短い",hint:"長さや背丈が少ない"},
    {en:"beautiful",ja:"美しい",hint:"見た目がきれい"},
  ],
  "動詞": [
    {en:"run",ja:"走る",hint:"速く移動する"},{en:"walk",ja:"歩く",hint:"足で進む"},
    {en:"eat",ja:"食べる",hint:"口に入れる"},{en:"drink",ja:"飲む",hint:"液体を口から入れる"},
    {en:"sleep",ja:"眠る",hint:"休息する"},{en:"read",ja:"読む",hint:"文字を目で追う"},
    {en:"write",ja:"書く",hint:"文字を記す"},{en:"study",ja:"勉強する",hint:"学ぶこと"},
    {en:"play",ja:"遊ぶ・演奏する",hint:"楽しく過ごす"},{en:"swim",ja:"泳ぐ",hint:"水の中を進む"},
    {en:"sing",ja:"歌う",hint:"声で音楽を奏でる"},{en:"dance",ja:"踊る",hint:"音楽に合わせて動く"},
    {en:"talk",ja:"話す",hint:"言葉を伝える"},{en:"listen",ja:"聞く",hint:"耳を傾ける"},
    {en:"watch",ja:"見る・観る",hint:"目で追って見る"},
  ],
};

let mode='flash', selectedCat='動物';
let allWords=[], shuffledWords=[];
let currentIndex=0, score=0, studied=0, streak=0, totalQ=0, correctQ=0;
let answered=false, showingAnswer=false;

function init() {
  const el = document.getElementById('categories');
  Object.keys(wordData).forEach(cat => {
    const p = document.createElement('button');
    p.className = 'cat-pill' + (cat===selectedCat?' active':'');
    p.textContent = cat;
    p.onclick = () => loadCategory(cat);
    el.appendChild(p);
  });
  loadCategory(selectedCat);
}

function loadCategory(cat) {
  selectedCat = cat;
  document.querySelectorAll('.cat-pill').forEach(p =>
    p.classList.toggle('active', p.textContent===cat));
  allWords = [...wordData[cat]];
  shuffledWords = shuffle([...allWords]);
  currentIndex=0; score=0; studied=0; streak=0; totalQ=0; correctQ=0;
  updateStats();
  hideResult();
  renderCard();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach((b,i) =>
    b.classList.toggle('active', ['flash','quiz','type'][i]===m));
  shuffledWords = shuffle([...allWords]);
  currentIndex=0; score=0; studied=0; streak=0; totalQ=0; correctQ=0;
  updateStats();
  hideResult();
  renderCard();
}

function hideResult() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('flashcard').classList.remove('hidden');
  document.getElementById('bottomBtns').classList.remove('hidden');
}

function renderCard() {
  if (currentIndex >= shuffledWords.length) { showResult(); return; }
  const word = shuffledWords[currentIndex];
  answered = false; showingAnswer = false;
  const enToJa = Math.random() > 0.5;

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('progressFill').style.width =
    Math.round((currentIndex/shuffledWords.length)*100) + '%';

  if (mode==='flash')     showFlashcard(word, enToJa);
  else if (mode==='quiz') showQuiz(word, enToJa);
  else                    showTyping(word);

  const fc = document.getElementById('flashcard');
  fc.classList.remove('flip-anim');
  void fc.offsetWidth;
  fc.classList.add('flip-anim');
}

function showFlashcard(word, enToJa) {
  show('flashcard'); hide('choices'); hide('typingInput');
  show('nextBtn'); hide('submitBtn');
  document.getElementById('cardLabel').textContent  = enToJa ? '英語 → 日本語' : '日本語 → 英語';
  document.getElementById('cardWord').textContent   = enToJa ? word.en : word.ja;
  document.getElementById('cardHint').textContent   = enToJa ? word.hint : '';
  document.getElementById('cardAnswer').classList.add('hidden');
  document.getElementById('cardAnswer').textContent = enToJa ? word.ja : word.en;
  document.getElementById('tapHint').style.display  = 'block';
}

function showQuiz(word, enToJa) {
  show('flashcard'); show('choices'); hide('typingInput');
  show('nextBtn'); hide('submitBtn');
  document.getElementById('cardLabel').textContent = enToJa ? '日本語は？' : '英語は？';
  document.getElementById('cardWord').textContent  = enToJa ? word.en : word.ja;
  document.getElementById('cardHint').textContent  = word.hint;
  document.getElementById('cardAnswer').classList.add('hidden');
  document.getElementById('tapHint').style.display = 'none';

  const correct = enToJa ? word.ja : word.en;
  const pool    = allWords.filter(w=>(enToJa?w.ja:w.en)!==correct);
  const options = shuffle([correct, ...shuffle(pool).slice(0,3).map(w=>enToJa?w.ja:w.en)]);
  const el = document.getElementById('choices');
  el.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => checkChoice(btn, opt, correct);
    el.appendChild(btn);
  });
}

function showTyping(word) {
  show('flashcard'); hide('choices'); show('typingInput');
  hide('nextBtn'); show('submitBtn');
  document.getElementById('submitBtn').textContent = '✔ 確認';
  document.getElementById('cardLabel').textContent = '英語でつづりを入力！';
  document.getElementById('cardWord').textContent  = word.ja;
  document.getElementById('cardHint').textContent  = word.hint;
  document.getElementById('cardAnswer').classList.add('hidden');
  document.getElementById('tapHint').style.display = 'none';
  const inp = document.getElementById('typingInput');
  inp.value=''; inp.className='typing-input'; inp.disabled=false;
  inp.onkeydown = e => { if(e.key==='Enter') checkTyping(); };
}

function handleCardClick() {
  if (mode!=='flash') return;
  if (!showingAnswer) {
    document.getElementById('cardAnswer').classList.remove('hidden');
    document.getElementById('tapHint').style.display = 'none';
    showingAnswer = true; studied++; updateStats();
  } else { nextCard(); }
}

function checkChoice(btn, selected, correct) {
  if (answered) return;
  answered=true; totalQ++; studied++;
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled=true;
    if (b.textContent===correct) b.classList.add('correct');
  });
  if (selected===correct) {
    score++; streak++; correctQ++;
    showFeedback(true);
    if (streak>=3) showStreakBadge();
    setTimeout(nextCard, 900);
  } else {
    btn.classList.add('wrong'); streak=0;
    showFeedback(false);
    setTimeout(nextCard, 1300);
  }
  updateStats();
}

function checkTyping() {
  if (answered) { nextCard(); return; }
  const word = shuffledWords[currentIndex];
  const inp  = document.getElementById('typingInput');
  const val  = inp.value.trim().toLowerCase();
  answered=true; totalQ++; studied++; inp.disabled=true;
  if (val===word.en.toLowerCase()) {
    inp.className='typing-input correct';
    score++; streak++; correctQ++;
    showFeedback(true);
    if (streak>=3) showStreakBadge();
    setTimeout(nextCard, 900);
  } else {
    inp.className='typing-input wrong'; streak=0;
    showFeedback(false, `正解：「${word.en}」`);
    document.getElementById('submitBtn').textContent = '次へ →';
  }
  updateStats();
}

function showFeedback(ok, extra='') {
  const el = document.getElementById('feedback');
  if (ok) {
    el.textContent = ['すごい！🎉','その調子！✨','パーフェクト！⭐','よくできました！🌟','Great!👏'][Math.floor(Math.random()*5)];
    el.className = 'feedback correct';
  } else {
    el.textContent = `残念😢 ${extra}`;
    el.className = 'feedback wrong';
  }
}

function nextCard() {
  document.getElementById('submitBtn').textContent = '✔ 確認';
  currentIndex++;
  renderCard();
}

function prevCard() {
  if (currentIndex>0) { currentIndex--; renderCard(); }
}

function showResult() {
  hide('flashcard'); hide('choices'); hide('typingInput');
  hide('nextBtn'); hide('submitBtn');
  document.getElementById('bottomBtns').classList.add('hidden');
  document.getElementById('progressFill').style.width = '100%';
  show('resultScreen');

  if (mode==='flash') {
    document.getElementById('resultEmoji').textContent = '📖';
    document.getElementById('resultScore').innerHTML = `${studied} <span>/ ${shuffledWords.length}枚</span>`;
    document.getElementById('resultMsg').textContent = 'すべてのカードを見ました！';
  } else {
    const pct = totalQ>0 ? Math.round((correctQ/totalQ)*100) : 0;
    document.getElementById('resultEmoji').textContent = pct>=80?'🏆':pct>=60?'🎉':'💪';
    document.getElementById('resultScore').innerHTML = `${correctQ} <span>/ ${totalQ}問</span>`;
    const msg = pct>=80?'素晴らしい！英語の達人！':pct>=60?'よく頑張りました！':'もう一度練習しよう！';
    document.getElementById('resultMsg').textContent = msg + ` (正答率 ${pct}%)`;
  }
}

function restart() {
  shuffledWords = shuffle([...allWords]);
  currentIndex=0; score=0; studied=0; streak=0; totalQ=0; correctQ=0;
  updateStats();
  hideResult();
  renderCard();
}

function updateStats() {
  document.getElementById('score').textContent   = score;
  document.getElementById('streak').textContent  = streak;
  document.getElementById('studied').textContent = studied;
}

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function showStreakBadge() {
  document.querySelector('.streak-badge')?.remove();
  const b = document.createElement('div');
  b.className='streak-badge';
  b.textContent=`🔥 ${streak}連続正解！`;
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), 2200);
}

init();
</script>
</body>
</html>
